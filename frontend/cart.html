<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your shopping cart – ShopVibe" />
    <title>Cart – ShopVibe</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="navbar-root"></div>

    <main class="main">
        <div class="container section">
            <h1 class="section-title">Shopping Cart</h1>
            <p class="section-sub" id="cart-subtitle"></p>

            <div id="empty-cart" class="empty-state" style="display:none">
                <div class="empty-icon">🛒</div>
                <h3>Your cart is empty</h3>
                <p>Add some products and come back here.</p>
                <a href="index.html" class="btn btn-primary">Continue Shopping</a>
            </div>

            <div id="cart-content" class="cart-layout" style="display:none">
                <!-- Items -->
                <div class="cart-items-container">
                    <div id="cart-items"></div>
                    <div class="cart-actions">
                        <button class="btn btn-secondary btn-sm" onclick="clearCartConfirm()">Clear Cart</button>
                    </div>
                </div>

                <!-- Summary -->
                <div class="card order-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Items (<span id="sum-count">0</span>)</span>
                        <span id="sum-subtotal">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery</span>
                        <span class="text-success">FREE</span>
                    </div>
                    <div class="summary-divider"></div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="sum-total">₹0</span>
                    </div>
                    
                    <div class="cart-notice">
                        <p>✨ Free delivery on all orders for a limited time!</p>
                    </div>

                    <a href="checkout.html" id="checkout-btn" class="btn btn-primary btn-full" style="margin-top:1rem;">
                        Proceed to Checkout →
                    </a>
                    <a href="index.html" class="btn btn-secondary btn-full" style="margin-top:0.75rem;">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div id="toast"></div>
    <script src="js/script.js"></script>
    <script>
        document.getElementById("navbar-root").innerHTML = navbar("cart")
        updateCartCount()

        function renderCart() {
            const cart = getCart()
            const empty = document.getElementById("empty-cart")
            const content = document.getElementById("cart-content")
            const subtitle = document.getElementById("cart-subtitle")

            if (!cart || cart.length === 0) {
                empty.style.display = "block"
                content.style.display = "none"
                subtitle.textContent = "Your cart is currently empty"
                return
            }

            empty.style.display = "none"
            content.style.display = "grid"
            subtitle.textContent = `${getCartCount()} item(s) in your cart`

            document.getElementById("cart-items").innerHTML = cart.map(item => `
                <div class="cart-item fade-in">
                    <div class="cart-item-main">
                        <img class="cart-item-img" src="${productImg(item)}" alt="${item.name}"
                            onerror="this.src='https://picsum.photos/seed/${item._id}/160/160'" />
                        <div class="cart-item-info">
                            <h3 class="cart-item-name"><a href="product.html?id=${item._id}">${item.name}</a></h3>
                            <div class="cart-item-price-each">${formatPrice(item.price)} each</div>
                            <div class="cart-item-qty-controls">
                                <button class="qty-btn" onclick="change('${item._id}', -1)">−</button>
                                <span class="qty-value">${item.qty || 1}</span>
                                <button class="qty-btn" onclick="change('${item._id}', 1)">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="cart-item-right">
                        <div class="cart-item-total">${formatPrice(item.price * (item.qty || 1))}</div>
                        <button class="btn-text-danger btn-sm" onclick="del('${item._id}')">Remove</button>
                    </div>
                </div>`).join("")

            const count = getCartCount()
            const total = getCartTotal()
            document.getElementById("sum-count").textContent = count
            document.getElementById("sum-subtotal").textContent = formatPrice(total)
            document.getElementById("sum-total").textContent = formatPrice(total)
        }

        function change(id, delta) {
            updateCartQty(id, delta)
            renderCart()
        }

        function del(id) {
            removeFromCart(id)
            renderCart()
            showToast("Item removed from cart", "info")
        }

        function clearCartConfirm() {
            if (confirm("Are you sure you want to clear your entire cart?")) {
                saveCart([])
                renderCart()
                showToast("Cart cleared", "info")
            }
        }

        renderCart()
    </script>
</body>

</html>
