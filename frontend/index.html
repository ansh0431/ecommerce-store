<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShopVibe – Discover premium products at amazing prices." />
    <title>ShopVibe – Home</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="navbar-root"></div>

    <main class="main">
        <!-- Hero -->
        <section class="hero">
            <div class="container">
                <div class="hero-badge">🔥 Millions of Products · Best Prices</div>
                <h1>India's <span class="gradient-text">Favourite</span><br>Online Store</h1>
                <p>Premium quality, unbeatable prices &amp; free delivery on every order.</p>
                <div class="hero-actions">
                    <a href="#products" class="btn btn-primary btn-lg">Shop Now</a>
                    <a href="cart.html" class="btn btn-secondary btn-lg" style="background:#fff;color:#2874f0">View Cart</a>
                </div>
            </div>
        </section>

        <!-- Products -->
        <section class="section" id="products">
            <div class="container">
                <div class="section-header">
                    <div>
                        <h2 class="section-title">All Products</h2>
                        <p class="section-sub">Handpicked items, just for you</p>
                    </div>
                </div>

                <!-- Search & Filter -->
                <div class="filter-bar">
                    <div class="search-box">
                        <input id="search-input" type="text" placeholder="Search products…" />
                        <span class="search-icon">🔍</span>
                    </div>
                    <select id="cat-filter">
                        <option value="">All Categories</option>
                    </select>
                    <div class="price-inputs">
                        <input id="min-price" type="number" placeholder="Min ₹" class="price-input" />
                        <input id="max-price" type="number" placeholder="Max ₹" class="price-input" />
                    </div>
                    <select id="sort-filter">
                        <option value="latest">Latest</option>
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                        <option value="name_asc">Name: A-Z</option>
                    </select>
                </div>

                <div id="active-filters" class="active-filters"></div>

                <div id="loader" class="skeleton-grid">
                    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line shorter"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line shorter"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line shorter"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line shorter"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line shorter"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line shorter"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line shorter"></div></div></div>
                    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line shorter"></div></div></div>
                </div>

                <div id="products-grid" class="product-grid" style="display:none"></div>

                <div id="empty" class="empty-state" style="display:none">
                    <div class="empty-icon">📦</div>
                    <h3>No products found</h3>
                    <p>Try a different search term or category.</p>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="pagination" style="display:none">
                    <button id="prev-page" class="btn btn-secondary btn-sm">Previous</button>
                    <span id="page-info">Page 1 of 1</span>
                    <button id="next-page" class="btn btn-secondary btn-sm">Next</button>
                </div>
            </div>
        </section>
    </main>

    <div id="toast"></div>
    <script src="js/script.js"></script>
    <script>
        document.getElementById("navbar-root").innerHTML = navbar("home")
        updateCartCount()

        let currentPage = 1
        let totalPages = 1

        async function loadProducts(q = "", cat = "", sort = "latest", min = "", max = "", page = 1) {
            try {
                document.getElementById("loader").style.display = "flex"
                document.getElementById("products-grid").style.display = "none"
                document.getElementById("empty").style.display = "none"
                document.getElementById("pagination").style.display = "none"

                const query = new URLSearchParams()
                if (q) query.append("search", q)
                if (cat) query.append("category", cat)
                if (sort) query.append("sort", sort)
                if (min) query.append("minPrice", min)
                if (max) query.append("maxPrice", max)
                query.append("page", page)
                query.append("limit", 12)

                updateActiveFilters(q, cat, sort, min, max)

                const res = await fetch(`${API}/api/products?${query.toString()}`)
                const data = await res.json()

                const products = data.products || []
                const pagination = data.pagination || { pages: 1, total: products.length }

                totalPages = pagination.pages
                currentPage = page

                // Only populate categories once initially
                if (!cat && !q && sort === "latest" && document.getElementById("cat-filter").options.length === 1) {
                    // We might need a separate endpoint for categories if allProducts isn't full list
                    // but for now let's use what we have
                    populateCategories(products)
                }

                renderProducts(products)
                renderPagination(pagination)
            } catch (err) {
                console.error(err)
                showToast("Failed to load products", "error")
            } finally {
                document.getElementById("loader").style.display = "none"
            }
        }

        function populateCategories(products) {
            // This is a bit limited since it only sees the first page's categories
            // Ideally backend would have a /categories endpoint
            const cats = [...new Set(products.map(p => p.category).filter(Boolean))]
            const sel = document.getElementById("cat-filter")
            cats.forEach(c => {
                const o = document.createElement("option")
                o.value = c
                o.textContent = c
                sel.appendChild(o)
            })
        }

        const urgencyLabels = ["Only 2 left!", "Top Seller", "Only 3 left!", "", "", ""]

        function renderProducts(products) {
            const grid = document.getElementById("products-grid")
            const empty = document.getElementById("empty")
            if (!products || !products.length) {
                grid.style.display = "none"
                empty.style.display = "block"
                return
            }
            empty.style.display = "none"
            grid.style.display = "grid"
            grid.innerHTML = products.map((p, i) => {
                const rating = p.rating || (3.8 + (i % 5) * 0.3).toFixed(1)
                const reviews = p.numReviews || (80 + i * 37)
                const mrp = Math.round(p.price * (1.15 + (i % 5) * 0.05))
                const discount = Math.round((mrp - p.price) / mrp * 100)
                const urgency = urgencyLabels[i % urgencyLabels.length]
                return `
                <article class="card product-card fade-in">
                    <a href="product.html?id=${p._id}" style="display:contents">
                    <div class="product-img">
                        <img src="${productImg(p)}" alt="${p.name}" loading="lazy" onerror="this.src='https://picsum.photos/seed/${p._id}/400/300'" />
                        ${p.category ? `<span class="category-tag">${p.category}</span>` : ""}
                        ${urgency ? `<span class="urgency-tag">${urgency}</span>` : ""}
                    </div></a>
                    <div class="product-body">
                        <h3 class="product-name"><a href="product.html?id=${p._id}">${p.name}</a></h3>
                        <div class="product-rating">
                            <span class="rating-badge">${rating} ★</span>
                            <span class="review-count">(${reviews})</span>
                        </div>
                        <p class="product-desc">${p.description ? p.description.substring(0,90)+'...' : 'Quality product at the best price.'}</p>
                        <div class="product-footer">
                            <div>
                                <span class="product-price">${formatPrice(p.price)}</span>
                                <span class="product-price-original">${formatPrice(mrp)}</span>
                                <span class="product-discount">${discount}% off</span>
                            </div>
                        </div>
                        <div class="free-delivery">✅ Free Delivery</div>
                        <div class="product-actions">
                            <a href="product.html?id=${p._id}" class="btn btn-secondary btn-sm">Details</a>
                            <button class="btn btn-primary btn-sm" onclick='addToCart(${JSON.stringify(p)})' ${p.stock===0?'disabled':''}>Add to Cart</button>
                        </div>
                    </div>
                </article>`
            }).join("")
        }

        function renderStars(rating = 0) {
            return "★".repeat(Math.round(rating)) + "☆".repeat(5 - Math.round(rating))
        }

        function renderPagination(pagination) {
            const nav = document.getElementById("pagination")
            if (pagination.pages <= 1) {
                nav.style.display = "none"
                return
            }
            nav.style.display = "flex"
            document.getElementById("page-info").textContent = `Page ${currentPage} of ${pagination.pages}`
            document.getElementById("prev-page").disabled = currentPage === 1
            document.getElementById("next-page").disabled = currentPage === pagination.pages
        }

        function updateActiveFilters(q, cat, sort, min, max) {
            const container = document.getElementById("active-filters")
            let filters = []
            if (q) filters.push(`Search: "${q}"`)
            if (cat) filters.push(`Category: ${cat}`)
            if (min) filters.push(`Min: ₹${min}`)
            if (max) filters.push(`Max: ₹${max}`)

            if (filters.length > 0) {
                container.style.display = "flex"
                container.innerHTML = filters.map(f => `<span class="filter-tag">${f}</span>`).join("") +
                    `<button class="btn-clear" onclick="clearFilters()">Clear All</button>`
            } else {
                container.style.display = "none"
            }
        }

        function clearFilters() {
            document.getElementById("search-input").value = ""
            document.getElementById("cat-filter").value = ""
            document.getElementById("sort-filter").value = "latest"
            document.getElementById("min-price").value = ""
            document.getElementById("max-price").value = ""
            applyFilters()
        }

        const applyFilters = debounce(() => {
            const q = document.getElementById("search-input").value.trim()
            const cat = document.getElementById("cat-filter").value
            const sort = document.getElementById("sort-filter").value
            const min = document.getElementById("min-price").value
            const max = document.getElementById("max-price").value
            loadProducts(q, cat, sort, min, max, 1)
        }, 500)

        document.getElementById("search-input").addEventListener("input", applyFilters)
        document.getElementById("cat-filter").addEventListener("change", applyFilters)
        document.getElementById("sort-filter").addEventListener("change", applyFilters)
        document.getElementById("min-price").addEventListener("input", applyFilters)
        document.getElementById("max-price").addEventListener("input", applyFilters)

        document.getElementById("prev-page").addEventListener("click", () => {
            if (currentPage > 1) {
                const q = document.getElementById("search-input").value.trim()
                const cat = document.getElementById("cat-filter").value
                const sort = document.getElementById("sort-filter").value
                const min = document.getElementById("min-price").value
                const max = document.getElementById("max-price").value
                loadProducts(q, cat, sort, min, max, currentPage - 1)
            }
        })

        document.getElementById("next-page").addEventListener("click", () => {
            if (currentPage < totalPages) {
                const q = document.getElementById("search-input").value.trim()
                const cat = document.getElementById("cat-filter").value
                const sort = document.getElementById("sort-filter").value
                const min = document.getElementById("min-price").value
                const max = document.getElementById("max-price").value
                loadProducts(q, cat, sort, min, max, currentPage + 1)
            }
        })

        loadProducts()
    </script>

</body>

</html>
