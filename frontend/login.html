<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to ShopVibe" />
    <title>Login – ShopVibe</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar-root"></div>
<main class="main">
    <div class="auth-container">
        <div class="auth-box">
            <h2>Welcome back 👋</h2>
            <p class="auth-sub">Login to your account to continue shopping</p>

            <div id="alert" class="alert"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="••••••••" required />
                </div>
                <button id="login-btn" type="submit" class="btn btn-primary btn-full btn-lg">Login</button>
            </form>

            <div class="auth-link">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>
</main>
<div id="toast"></div>
<script src="js/script.js"></script>
<script>
    document.getElementById("navbar-root").innerHTML = navbar("login")

    if (isLoggedIn()) window.location.href = "index.html"

    document.getElementById("login-form").addEventListener("submit", async e => {
        e.preventDefault()
        const email    = document.getElementById("email").value.trim()
        const password = document.getElementById("password").value

        if (!email || !password) { showAlert("alert", "Please fill in all fields."); return }

        setLoading("login-btn", true)
        try {
            const res  = await fetch(`${API}/api/users/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            })
            const data = await res.json()
            if (!res.ok) { showAlert("alert", data.message || "Login failed."); return }
            localStorage.setItem("token", data.token)
            localStorage.setItem("user",  JSON.stringify(data.user))
            showToast("Login successful! Redirecting…", "success")
            setTimeout(() => window.location.href = "index.html", 900)
        } catch {
            showAlert("alert", "Network error. Is the backend running?")
        } finally {
            setLoading("login-btn", false)
        }
    })
</script>
</body>
</html>
