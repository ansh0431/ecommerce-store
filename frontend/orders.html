<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders – ShopVibe</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="navbar-root"></div>

    <main class="main">
        <div class="container section">
            <h1 class="section-title">My Orders</h1>
            <p class="section-sub">View your order history and tracking status</p>

            <div id="loader" class="loader">
                <div class="spinner"></div>
            </div>

            <div id="empty-orders" class="empty-state" style="display:none">
                <div class="empty-icon">📦</div>
                <h3>No orders yet</h3>
                <p>Looks like you haven't placed any orders. Start shopping today!</p>
                <a href="index.html" class="btn btn-primary">Start Shopping</a>
            </div>

            <div id="orders-container" class="orders-stack" style="display:none;">
                <!-- Orders injected here -->
            </div>
        </div>
    </main>

    <div id="toast"></div>
    <script src="js/script.js"></script>
    <script>
        document.getElementById("navbar-root").innerHTML = navbar("orders")
        updateCartCount()

        if (!isLoggedIn()) {
            window.location.href = "login.html?redirect=orders.html"
        }

        async function loadOrders() {
            try {
                document.getElementById("loader").style.display = "flex"
                document.getElementById("orders-container").style.display = "none"
                document.getElementById("empty-orders").style.display = "none"

                const res = await fetch(`${API}/api/orders/my-orders`, {
                    headers: getAuthHeaders()
                })
                
                if (!res.ok) {
                    if (res.status === 401) {
                        showToast("Session expired. Please login again.", "error")
                        setTimeout(() => window.location.href = "login.html", 1500)
                        return
                    }
                    throw new Error("Failed to load orders")
                }
                
                const orders = await res.json()
                
                if (!orders || orders.length === 0) {
                    document.getElementById("empty-orders").style.display = "block"
                    return
                }

                renderOrders(orders)
            } catch (err) {
                console.error(err)
                showToast("Error loading orders. Please try again later.", "error")
            } finally {
                document.getElementById("loader").style.display = "none"
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById("orders-container")
            container.style.display = "flex"
            
            container.innerHTML = orders.map(order => {
                const date = new Date(order.createdAt).toLocaleDateString("en-IN", {
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                })
                
                const statusClass = `status-${order.status.toLowerCase()}`
                
                return `
                <div class="order-card card fade-in">
                    <div class="order-header">
                        <div class="order-meta">
                            <span class="order-id">#${order._id}</span>
                            <span class="order-date">${date}</span>
                        </div>
                        <div class="order-badge ${statusClass}">${order.status}</div>
                    </div>
                    
                    <div class="order-body">
                        <div class="order-items-list">
                            ${(order.products || []).map(item => `
                                <div class="order-product">
                                    <div class="product-mini-info">
                                        <strong>${item.productId?.name || 'Unknown Product'}</strong>
                                        <span class="text-muted">× ${item.quantity}</span>
                                    </div>
                                    <span class="product-item-total">${formatPrice((item.productId?.price || 0) * item.quantity)}</span>
                                </div>
                            `).join("")}
                        </div>
                    </div>

                    <div class="order-footer">
                        <div class="shipping-preview">
                            <span class="text-muted small">Shipped to:</span>
                            <p class="small">${order.shippingAddress || 'No address provided'}</p>
                        </div>
                        <div class="order-grand-total">
                            <span class="total-label">Total Paid</span>
                            <span class="total-amount">${formatPrice(order.totalPrice)}</span>
                        </div>
                    </div>
                </div>`
            }).join("")
        }

        loadOrders()
    </script>
</body>

</html>
