<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create an account – ShopVibe" />
    <title>Register – ShopVibe</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar-root"></div>
<main class="main">
    <div class="auth-container">
        <div class="auth-box">
            <h2>Create Account 🚀</h2>
            <p class="auth-sub">Join ShopVibe and start shopping today</p>

            <div id="alert" class="alert"></div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input id="name" type="text" placeholder="John Doe" required />
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Min. 6 characters" required minlength="6" />
                </div>
                <div class="form-group">
                    <label for="confirm">Confirm Password</label>
                    <input id="confirm" type="password" placeholder="Re-enter password" required />
                </div>
                <button id="register-btn" type="submit" class="btn btn-primary btn-full btn-lg">Create Account</button>
            </form>

            <div class="auth-link">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>
</main>
<div id="toast"></div>
<script src="js/script.js"></script>
<script>
    document.getElementById("navbar-root").innerHTML = navbar()

    if (isLoggedIn()) window.location.href = "index.html"

    document.getElementById("register-form").addEventListener("submit", async e => {
        e.preventDefault()
        const name     = document.getElementById("name").value.trim()
        const email    = document.getElementById("email").value.trim()
        const password = document.getElementById("password").value
        const confirm  = document.getElementById("confirm").value

        if (!name || !email || !password) { showAlert("alert", "Please fill in all fields."); return }
        if (password.length < 6)          { showAlert("alert", "Password must be at least 6 characters."); return }
        if (password !== confirm)         { showAlert("alert", "Passwords do not match."); return }

        setLoading("register-btn", true)
        try {
            const res  = await fetch(`${API}/api/users/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email, password })
            })
            const data = await res.json()
            if (!res.ok) { showAlert("alert", data.error || "Registration failed."); return }
            showAlert("alert", "Account created! Redirecting to login…", "success")
            setTimeout(() => window.location.href = "login.html", 1200)
        } catch {
            showAlert("alert", "Network error. Is the backend running?")
        } finally {
            setLoading("register-btn", false)
        }
    })
</script>
</body>
</html>
